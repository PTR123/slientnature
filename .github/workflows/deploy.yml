name: Deploy to NAS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            pet-keeper-backend/package-lock.json
            pet-keeper/package-lock.json

      - name: Install backend dependencies
        working-directory: pet-keeper-backend
        run: npm ci

      - name: Run backend tests
        working-directory: pet-keeper-backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: pet-keeper
        run: npm ci

      - name: Build frontend
        working-directory: pet-keeper
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to NAS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script: |
            cd /volume1/projects/ziranbuyu
            git pull origin main
            ./scripts/ota-update.sh

      - name: Send notification
        if: always()
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"自然不语部署${{ job.status == 'success' && '成功' || '失败' }}\"}"